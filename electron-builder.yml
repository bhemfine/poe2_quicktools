appId: com.bhemfine.poe2quicktools
productName: PoE2QuickTools
copyright: Copyright © 2026 Bhemfine
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - THIRD_PARTY_NOTICES.md
# Native modules ship N-API prebuilds; they must live outside the asar archive.
asarUnpack:
  - '**/*.node'
npmRebuild: false
win:
  target:
    - nsis
    - portable
  # Unsigned until a code-signing certificate is bought (see docs/release.md).
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
# Release feed for electron-updater. The source repo is private, so releases go to a separate
# public repo (decision pending, see docs/release.md). Change owner/repo here once it exists.
publish:
  provider: github
  owner: bhemfine
  repo: poe2_quicktools-releases
  releaseType: release
